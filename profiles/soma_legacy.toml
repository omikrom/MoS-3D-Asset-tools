north_west = ["shadow", "body", "trousers", "arms_weapon", "boots", "armour", "helmet", "shield"]
north = ["shadow", "shield", "body", "trousers", "boots", "armour", "arms_weapon", "helmet"]
north_east = ["shadow", "body", "trousers", "boots", "armour", "helmet", "arms_weapon", "shield"]
